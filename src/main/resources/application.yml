server:
  port: ${PORT:3000}
  address: 0.0.0.0
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

spring:
  application:
    name: taskflow-api-springboot

  datasource:
    url: jdbc:${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    url: jdbc:${DIRECT_URL:${DATABASE_URL}}
    user: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
  packages-to-scan: com.taskflow.api

taskflow:
  service-name: ${SERVICE_NAME:taskflow-api-spring-boot}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests: ${RATE_LIMIT_REQUESTS:100}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    idle-eviction-seconds: ${RATE_LIMIT_IDLE_EVICTION_SECONDS:600}
    cleanup-interval-ms: ${RATE_LIMIT_CLEANUP_INTERVAL_MS:300000}

logging:
  level:
    com.taskflow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: production

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    com.taskflow: INFO
    org.springframework.web: WARN