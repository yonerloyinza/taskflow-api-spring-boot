services:
  api-springboot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api-springboot
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-/opt/taskflow/.env.springboot}
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=3000
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-springboot.rule=Host(`${TRAEFIK_HOST:-taskflow-api-springboot.xprad.com}`)"
      - "traefik.http.routers.api-springboot.entrypoints=websecure"
      - "traefik.http.routers.api-springboot.tls.certresolver=lets-encrypt"
      - "traefik.http.services.api-springboot.loadbalancer.server.port=3000"
      - "traefik.http.routers.api-springboot.middlewares=secHeaders@file"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - public

networks:
  public:
    external: true